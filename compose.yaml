name: ${PROJECT:-roosa-biz}

services:
  web:
    build:
      context: .
      labels:
        com.project: ${PROJECT_LABEL:-roosa-biz}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NGINX_APP_PORT:-12017}:3000"
    labels:
      com.project: ${PROJECT_LABEL:-roosa-biz}
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Europe/Zurich}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          memory: 512M

